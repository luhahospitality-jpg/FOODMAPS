<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>BLOCK RACERS - Controller</title>
<style>
  * { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:none; box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#0a0a0a; overflow:hidden; font-family:sans-serif; color:#fff; }
  #status { position:fixed; top:8px; left:0; right:0; text-align:center; font-size:16px; z-index:5; }
  #rotateMsg { position:fixed; inset:0; background:#000; color:#fff; display:none; align-items:center; justify-content:center; font-size:28px; text-align:center; z-index:10; }

  #selectInfo { position:fixed; top:34px; left:0; right:0; text-align:center; z-index:6; }
  #selectInfo .emoji { font-size:54px; display:block; }
  #selectInfo .name { font-size:16px; letter-spacing:2px; font-weight:bold; }
  #selectInfo .hint { font-size:12px; opacity:0.7; margin-top:4px; }

  #pad { position:fixed; inset:0; display:flex; }
  #stickArea { position:relative; width:45%; height:100%; }
  #stickBase { position:absolute; width:150px; height:150px; border-radius:50%; background:#222; border:3px solid #555; top:50%; left:50%; transform:translate(-50%,-50%); }
  #stickKnob { position:absolute; width:70px; height:70px; border-radius:50%; background:#888; top:50%; left:50%; transform:translate(-50%,-50%); }
  #buttons { position:relative; width:55%; height:100%; }
  .btn { position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:16px; color:#fff; text-align:center; line-height:1.1; opacity:1; transition:opacity 0.15s; }
  .btn.disabled { opacity:0.35; }
  #accel { width:130px; height:130px; background:#2ecc71; bottom:20px; right:20px; font-size:20px; }
  #brake { width:100px; height:100px; background:#e74c3c; bottom:30px; right:165px; }
  #boost { width:95px; height:95px; background:#ffb703; bottom:150px; right:20px; color:#111; }
  #power { width:95px; height:95px; background:#8e44ad; bottom:150px; right:165px; }
</style>
</head>
<body>
<div id="status">Conectando...</div>
<div id="rotateMsg">ROTATE YOUR PHONE</div>

<div id="selectInfo" style="display:none;">
  <span class="emoji" id="selEmoji">🐰</span>
  <span class="name" id="selName">CONEJO</span>
  <div class="hint" id="selHint">Mové el joystick para cambiar - tocá ELEGIR para confirmar</div>
</div>

<div id="pad">
  <div id="stickArea">
    <div id="stickBase"><div id="stickKnob"></div></div>
  </div>
  <div id="buttons">
    <div class="btn" id="power">POWER</div>
    <div class="btn" id="boost">BOOST</div>
    <div class="btn" id="brake">BRAKE</div>
    <div class="btn" id="accel">GO</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const EMOJI = { rabbit: '🐰', gorilla: '🦍', princess: '👸', ice: '🧊' };
  const NAMES = { rabbit: 'CONEJO', gorilla: 'GORILA', princess: 'PRINCESA', ice: 'HIELO' };

  const socket = io();
  const statusEl = document.getElementById('status');
  const accelBtn = document.getElementById('accel');
  const brakeBtn = document.getElementById('brake');
  const boostBtn = document.getElementById('boost');
  const powerBtn = document.getElementById('power');
  const selectInfo = document.getElementById('selectInfo');
  const selEmoji = document.getElementById('selEmoji');
  const selName = document.getElementById('selName');
  const selHint = document.getElementById('selHint');

  let mySteer = 0, myAccel = false, myBrake = false;
  let currentPhase = 'select';
  let hasBoost = false, powerReady = true;

  socket.on('connect', () => socket.emit('join'));
  socket.on('joined', (data) => {
    statusEl.textContent = 'Sos ' + data.id;
    statusEl.style.color = data.color;
    document.body.style.background = '#000';
  });
  socket.on('full', () => { statusEl.textContent = 'Sala llena (max 4)'; });

  socket.on('status', (s) => {
    currentPhase = s.phase;
    hasBoost = s.hasBoost;
    powerReady = s.powerReady;

    if (s.phase === 'select' && !s.confirmed) {
      selectInfo.style.display = 'block';
      selEmoji.textContent = EMOJI[s.character] || '';
      selName.textContent = NAMES[s.character] || '';
      selHint.textContent = 'Move el joystick para cambiar - toca ELEGIR para confirmar';
      accelBtn.textContent = 'ELEGIR';
      brakeBtn.classList.add('disabled');
      boostBtn.classList.add('disabled');
      powerBtn.classList.add('disabled');
    } else if (s.phase === 'select' && s.confirmed) {
      selectInfo.style.display = 'block';
      selEmoji.textContent = EMOJI[s.character] || '';
      selName.textContent = NAMES[s.character] || '';
      selHint.textContent = 'LISTO - esperando a los demas jugadores...';
      accelBtn.textContent = 'GO';
    } else {
      selectInfo.style.display = 'none';
      accelBtn.textContent = 'GO';
      brakeBtn.classList.remove('disabled');
      boostBtn.classList.toggle('disabled', !hasBoost);
      powerBtn.classList.toggle('disabled', !powerReady);
      powerBtn.textContent = powerReady ? 'POWER' : s.cooldownSec;
    }
  });

  function sendInput() {
    socket.emit('input', { steer: mySteer, accel: myAccel, brake: myBrake });
  }
  setInterval(sendInput, 50);

  // Joystick tactil (eje horizontal)
  const stickArea = document.getElementById('stickArea');
  const stickKnob = document.getElementById('stickKnob');
  let activeTouchId = null;

  function setKnob(dx) {
    const max = 55;
    dx = Math.max(-max, Math.min(max, dx));
    stickKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), -50%)';
    mySteer = dx / max;
  }
  function resetKnob() {
    stickKnob.style.transform = 'translate(-50%, -50%)';
    mySteer = 0;
  }

  stickArea.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    activeTouchId = t.identifier;
    handleStickMove(t);
  });
  stickArea.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === activeTouchId) handleStickMove(t);
    }
  });
  stickArea.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === activeTouchId) { activeTouchId = null; resetKnob(); }
    }
  });
  function handleStickMove(t) {
    const rect = stickArea.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    setKnob(t.clientX - cx);
  }

  function bindHold(el, onStart, onEnd) {
    el.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
    el.addEventListener('touchcancel', (e) => { e.preventDefault(); onEnd(); });
  }
  bindHold(accelBtn, () => myAccel = true, () => myAccel = false);
  bindHold(brakeBtn, () => { if (currentPhase === 'racing') myBrake = true; }, () => myBrake = false);

  boostBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (currentPhase === 'racing' && hasBoost) socket.emit('boost');
  });
  powerBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (currentPhase === 'racing' && powerReady) socket.emit('power');
  });

  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  function checkOrientation() {
    const isPortrait = window.innerHeight > window.innerWidth;
    document.getElementById('rotateMsg').style.display = isPortrait ? 'flex' : 'none';
  }
  window.addEventListener('resize', checkOrientation);
  checkOrientation();
</script>
</body>
</html>
