<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>BLOCK RACERS - TV</title>
<style>
  html, body { margin:0; padding:0; background:#111; overflow:hidden; cursor:none; height:100%; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas { background:#1a1a2e; max-width:100%; max-height:100%; }
  #url { position:fixed; bottom:10px; left:10px; color:#0f0; font-family:monospace; font-size:16px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1600" height="900"></canvas>
</div>
<div id="url"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const EMOJI = { rabbit: '🐰', gorilla: '🦍', princess: '👸', ice: '🧊' };
  const NAMES = { rabbit: 'CONEJO', gorilla: 'GORILA', princess: 'PRINCESA', ice: 'HIELO' };
  const CHAR_ORDER = ['rabbit', 'gorilla', 'princess', 'ice'];

  document.getElementById('url').textContent =
    'Abre en tu iPhone: ' + location.origin + '/controller';

  let state = { phase: 'select', countdown: 0, track: [], trackWidth: 170, guardrailSegments: [], players: [], boxes: [], peels: [], flowers: [], ice: { active: false } };
  socket.on('state', (s) => { state = s; });

  // ---------- utilidades ----------
  function roundRectAt(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function trackPath(track) {
    if (!track.length) return;
    ctx.beginPath();
    ctx.moveTo(track[0].x, track[0].y);
    for (let i = 1; i < track.length; i++) ctx.lineTo(track[i].x, track[i].y);
    ctx.closePath();
  }

  function radialFill(cx, cy, r, light, dark) {
    const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    g.addColorStop(0, light);
    g.addColorStop(1, dark);
    return g;
  }

  function drawTrackEdges() {
    const track = state.track;
    if (!track || !track.length) return;
    const half = state.trackWidth / 2;
    const guarded = state.guardrailSegments || [];
    for (let i = 0; i < track.length; i++) {
      const a = track[i], b = track[(i + 1) % track.length];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const isGuarded = guarded.includes(i);
      [1, -1].forEach((side) => {
        const ax = a.x + nx * half * side, ay = a.y + ny * half * side;
        const bx = b.x + nx * half * side, by = b.y + ny * half * side;
        if (isGuarded) {
          ctx.strokeStyle = '#e8b800';
          ctx.lineWidth = 8;
          ctx.setLineDash([]);
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
          ctx.strokeStyle = '#1a1a1a';
          ctx.setLineDash([14, 14]);
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
          ctx.setLineDash([]);
        } else {
          ctx.strokeStyle = 'rgba(255,110,30,0.6)';
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        }
      });
    }
  }

  function drawTree(x, y) {
    ctx.fillStyle = '#7a4a2b';
    ctx.fillRect(x - 4, y, 8, 16);
    ctx.fillStyle = '#2e8b3d';
    ctx.beginPath(); ctx.arc(x, y - 6, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3fae52';
    ctx.beginPath(); ctx.arc(x - 5, y - 10, 9, 0, Math.PI * 2); ctx.fill();
  }

  function drawTorch(x, y, t) {
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(x - 4, y - 20, 8, 30);
    const flick = 6 + Math.sin(t * 8 + x) * 2;
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.arc(x, y - 26, flick, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(x, y - 28, flick * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawCrowd(x, y, color, t) {
    const bounce = Math.abs(Math.sin(t * 3 + x * 0.05)) * 5;
    ctx.fillStyle = color;
    ctx.fillRect(x - 6, y - 14 - bounce, 12, 16);
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath(); ctx.arc(x, y - 20 - bounce, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 10 - bounce); ctx.lineTo(x - 12, y - 20 - bounce * 1.5);
    ctx.moveTo(x + 6, y - 10 - bounce); ctx.lineTo(x + 12, y - 20 - bounce * 1.5);
    ctx.stroke();
  }

  const CROWD_SPOTS = [
    [150, 160, '#ff6b6b'], [520, 110, '#4da6ff'], [900, 130, '#ffd24d'],
    [1250, 140, '#4dff88'], [1480, 300, '#ff6b6b'], [1480, 620, '#4da6ff'],
    [1300, 790, '#ffd24d'], [900, 810, '#4dff88'], [550, 800, '#ff6b6b'],
    [160, 680, '#4da6ff'],
  ];
  const TORCH_SPOTS = [[300, 340], [1350, 380], [980, 660], [340, 640]];

  function drawBackground(t) {
    const tile = 100;
    for (let y = 0; y < canvas.height; y += tile) {
      for (let x = 0; x < canvas.width; x += tile) {
        const even = ((x / tile) + (y / tile)) % 2 === 0;
        ctx.fillStyle = even ? '#4CAF50' : '#43a047';
        ctx.fillRect(x, y, tile, tile);
      }
    }
    for (let x = 60; x < canvas.width; x += 130) { drawTree(x, 40); drawTree(x, canvas.height - 30); }
    for (let y = 160; y < canvas.height - 100; y += 130) { drawTree(40, y); drawTree(canvas.width - 40, y); }

    if (state.track && state.track.length) {
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      trackPath(state.track);
      ctx.strokeStyle = '#8d8d95';
      ctx.lineWidth = state.trackWidth + 18;
      ctx.stroke();
      trackPath(state.track);
      ctx.strokeStyle = '#46464e';
      ctx.lineWidth = state.trackWidth;
      ctx.stroke();

      if (state.ice && state.ice.active) {
        trackPath(state.track);
        ctx.strokeStyle = 'rgba(140,220,255,0.4)';
        ctx.lineWidth = state.trackWidth;
        ctx.stroke();
      }

      drawTrackEdges();

      trackPath(state.track);
      ctx.setLineDash([24, 18]);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.setLineDash([]);

      // linea de meta
      const a = state.track[0], b = state.track[1];
      ctx.save();
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      ctx.translate(a.x + (b.x - a.x) * 0.12, a.y + (b.y - a.y) * 0.12);
      ctx.rotate(ang + Math.PI / 2);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-state.trackWidth / 2, -6, state.trackWidth, 12);
      ctx.restore();
    }

    CROWD_SPOTS.forEach(([x, y, c]) => drawCrowd(x, y, c, t));
    TORCH_SPOTS.forEach(([x, y]) => drawTorch(x, y, t));
  }

  function drawStartBanner() {
    ctx.save();
    ctx.translate(canvas.width / 2, 90);
    ctx.fillStyle = '#fff';
    roundRectAt(-140, -26, 280, 52, 12);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('BLOCK RACERS', 0, 9);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  // ---------- personajes ----------
  function drawCharacterFace(character, r) {
    if (character === 'rabbit') {
      [-1, 1].forEach((side) => {
        ctx.save();
        ctx.translate(side * r * 0.35, -r * 0.2);
        ctx.rotate(side * 0.4);
        ctx.fillStyle = radialFill(0, -r * 1.5, r * 1.1, '#ffffff', '#e3e3e3');
        ctx.beginPath(); ctx.ellipse(0, -r * 1.5, r * 0.35, r * 1.1, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb6c1';
        ctx.beginPath(); ctx.ellipse(0, -r * 1.5, r * 0.16, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
      ctx.fillStyle = radialFill(0, 0, r, '#ffffff', '#dcdcdc');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.05, r * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.32, -r * 0.05, r * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.1, r * 0.04, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.36, -r * 0.1, r * 0.04, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8fa3';
      ctx.beginPath(); ctx.arc(0, r * 0.25, r * 0.15, 0, Math.PI * 2); ctx.fill();
    } else if (character === 'gorilla') {
      ctx.fillStyle = radialFill(0, 0, r, '#8a5c3d', '#432a1a');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = radialFill(0, r * 0.3, r * 0.6, '#dab98a', '#a9825a');
      ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.6, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.05, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.05, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(-r * 0.41, -r * 0.11, r * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.29, -r * 0.11, r * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-r * 0.13, -r * 0.05); ctx.lineTo(r * 0.13, -r * 0.05); ctx.stroke();
    } else if (character === 'princess') {
      ctx.fillStyle = radialFill(0, -r * 0.1, r * 1.25, '#ffa8d6', '#e6549e');
      ctx.beginPath(); ctx.arc(0, -r * 0.1, r * 1.25, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = radialFill(0, 0, r, '#ffe6cf', '#f0be96');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 0.9); ctx.lineTo(0, -r * 1.5); ctx.lineTo(r * 0.5, -r * 0.9);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c99a1c'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#ff8fc7';
      ctx.beginPath(); ctx.arc(-r * 0.55, r * 0.15, r * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.55, r * 0.15, r * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.05, r * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.05, r * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c9c9c9';
      ctx.beginPath();
      ctx.moveTo(-r * 0.3, r * 0.35); ctx.lineTo(0, r * 1.1); ctx.lineTo(r * 0.3, r * 0.35);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#9a9a9a'; ctx.lineWidth = 1; ctx.stroke();
    } else if (character === 'ice') {
      ctx.fillStyle = radialFill(0, 0, r, '#eafcff', '#8fd6ef');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5fb8db'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#1c3d5a';
      ctx.beginPath(); ctx.ellipse(0, -r * 0.15, r * 0.85, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.25, r * 0.2, r * 0.1, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      [-1, 0, 1].forEach((k) => {
        ctx.beginPath();
        ctx.moveTo(k * r * 0.4, -r * 0.9);
        ctx.lineTo(k * r * 0.4 - r * 0.12, -r * 1.4);
        ctx.lineTo(k * r * 0.4 + r * 0.12, -r * 1.4);
        ctx.closePath(); ctx.fill();
      });
    }
  }

  function drawKartBody(character) {
    if (character === 'rabbit') {
      ctx.fillStyle = '#3fae52';
      [-1, 1].forEach((s) => {
        ctx.beginPath();
        ctx.moveTo(-18, s * 4); ctx.lineTo(-30, s * 12); ctx.lineTo(-24, s * 2);
        ctx.closePath(); ctx.fill();
      });
      ctx.beginPath();
      ctx.moveTo(26, 0); ctx.lineTo(6, -12); ctx.lineTo(-18, -10);
      ctx.lineTo(-20, 0); ctx.lineTo(-18, 10); ctx.lineTo(6, 12);
      ctx.closePath();
      ctx.fillStyle = radialFill(4, -4, 32, '#ffb066', '#e2691a');
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(-6, 9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -6); ctx.lineTo(8, 6); ctx.stroke();
    } else if (character === 'gorilla') {
      ctx.beginPath();
      ctx.moveTo(24, -2);
      ctx.quadraticCurveTo(4, -16, -22, -6);
      ctx.quadraticCurveTo(-8, -2, -8, 4);
      ctx.quadraticCurveTo(6, 10, 24, -2);
      ctx.closePath();
      ctx.fillStyle = radialFill(6, -6, 30, '#fde58a', '#d9a520');
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#7a5230';
      ctx.beginPath(); ctx.ellipse(-22, -6, 5, 4, 0.5, 0, Math.PI * 2); ctx.fill();
    } else if (character === 'princess') {
      roundRectAt(-20, -12, 40, 24, 8);
      ctx.fillStyle = radialFill(0, -4, 28, '#ff9fce', '#e63f8f');
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff0f6';
      ctx.beginPath();
      ctx.moveTo(14, -3); ctx.lineTo(19, 0); ctx.lineTo(14, 3); ctx.lineTo(10, 0);
      ctx.closePath(); ctx.fill();
    } else if (character === 'ice') {
      ctx.beginPath();
      ctx.moveTo(24, 0); ctx.lineTo(10, -13); ctx.lineTo(-20, -11);
      ctx.lineTo(-22, 0); ctx.lineTo(-20, 11); ctx.lineTo(10, 13);
      ctx.closePath();
      ctx.fillStyle = radialFill(2, -4, 30, '#e3f8ff', '#6fbedd');
      ctx.fill();
      ctx.strokeStyle = 'rgba(20,70,100,0.4)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(14, -6); ctx.lineTo(16, 0); ctx.lineTo(14, 6);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawKart(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(2, 4, 24, 15, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-15, -16, 8, 6);
    ctx.fillRect(-15, 10, 8, 6);
    ctx.fillRect(7, -16, 8, 6);
    ctx.fillRect(7, 10, 8, 6);

    drawKartBody(p.character);
    drawCharacterFace(p.character, 9);

    if (p.boosting) {
      ctx.fillStyle = 'rgba(255,200,0,0.7)';
      ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(-40, 0); ctx.lineTo(-20, 6); ctx.closePath(); ctx.fill();
    }
    if (p.slowed) {
      ctx.strokeStyle = 'rgba(150,80,255,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
    }
    if (p.sparked) {
      ctx.strokeStyle = '#fff59d';
      ctx.lineWidth = 2;
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 16);
        ctx.lineTo(Math.cos(a) * 28, Math.sin(a) * 28);
        ctx.stroke();
      }
    }
    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.id, p.x, p.y + 36);
    ctx.textAlign = 'left';
  }

  function drawItems() {
    (state.boxes || []).forEach((b) => {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.fillStyle = '#ffd24d';
      roundRectAt(-14, -14, 28, 28, 5);
      ctx.fill();
      ctx.fillStyle = '#a5730a';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('?', 0, 6);
      ctx.restore();
    });
    (state.peels || []).forEach((pe) => {
      ctx.fillStyle = '#e8d100';
      ctx.beginPath(); ctx.ellipse(pe.x, pe.y, 14, 8, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2;
      ctx.stroke();
    });
    (state.flowers || []).forEach((fl) => {
      ctx.fillStyle = '#c04dff';
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(fl.x + Math.cos(a) * 6, fl.y + Math.sin(a) * 6, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#3fae52';
      ctx.beginPath(); ctx.arc(fl.x, fl.y, 4, 0, Math.PI * 2); ctx.fill();
    });
    ctx.textAlign = 'left';
  }

  function drawHud() {
    let y = 20;
    const x = canvas.width - 220;
    state.players.forEach((p) => {
      if (!p) return;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRectAt(x, y, 205, 72, 8);
      ctx.fill();
      ctx.fillStyle = p.color;
      ctx.fillRect(x, y, 8, 72);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(p.id + ' ' + (EMOJI[p.character] || ''), x + 16, y + 20);

      ctx.font = '13px sans-serif';
      ctx.fillText('VUELTA ' + p.lap, x + 16, y + 38);

      ctx.fillStyle = '#ff5f6d';
      ctx.font = '15px sans-serif';
      ctx.fillText('❤'.repeat(p.lives) + '♡'.repeat(Math.max(0, 3 - p.lives)), x + 16, y + 58);

      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = p.hasBoost ? '#ffd24d' : '#555';
      ctx.fillText('BOOST', x + 120, y + 38);
      ctx.fillStyle = p.powerReady ? '#8effa0' : '#555';
      ctx.fillText('PODER', x + 120, y + 58);

      y += 82;
    });
  }

  // ---------- pantalla de seleccion ----------
  function drawSelectScreen() {
    ctx.fillStyle = '#141426';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px Arial';
    ctx.fillText('BLOCK RACERS', canvas.width / 2, 110);
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#ffd24d';
    ctx.fillText('ELIGE TU CORREDOR', canvas.width / 2, 150);

    const cardW = 260, cardH = 300, gap = 30;
    const totalW = cardW * 4 + gap * 3;
    const startX = (canvas.width - totalW) / 2;
    const cardY = 220;

    CHAR_ORDER.forEach((char, i) => {
      const cx = startX + i * (cardW + gap);
      ctx.fillStyle = '#1f1f38';
      roundRectAt(cx, cardY, cardW, cardH, 16);
      ctx.fill();

      ctx.save();
      ctx.translate(cx + cardW / 2, cardY + 110);
      ctx.scale(3.2, 3.2);
      drawCharacterFace(char, 9);
      ctx.restore();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px Arial';
      ctx.fillText(NAMES[char], cx + cardW / 2, cardY + 210);

      const holders = state.players.filter((p) => p && p.character === char);
      holders.forEach((p, hi) => {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 5;
        roundRectAt(cx + 4, cardY + 4, cardW - 8, cardH - 8, 14);
        ctx.stroke();
        ctx.fillStyle = p.color;
        ctx.font = 'bold 16px Arial';
        ctx.fillText((p.confirmed ? '✔ ' : '') + p.id, cx + cardW / 2, cardY + cardH - 20 - hi * 20);
      });
    });

    ctx.font = '16px Arial';
    ctx.fillStyle = '#ccc';
    ctx.fillText('Movan el joystick para elegir y toquen ELEGIR para confirmar', canvas.width / 2, cardY + cardH + 50);
    ctx.textAlign = 'left';
  }

  // inclina la escena para dar sensacion de camara aerea (2.5D, sin 3D real)
  function withTilt(fn) {
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.16);
    sky.addColorStop(0, '#1b1030');
    sky.addColorStop(1, '#2f1f4d');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height * 0.16);

    ctx.save();
    ctx.translate(0, canvas.height * 0.11);
    ctx.scale(1, 0.86);
    fn();
    ctx.restore();
  }

  function drawWorld(t) {
    drawBackground(t);
    drawItems();
    state.players.forEach((p) => { if (p) drawKart(p); });
  }

  function drawCountdown(t) {
    withTilt(() => drawWorld(t));
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 160px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(state.countdown > 0 ? String(state.countdown) : 'GO!', canvas.width / 2, canvas.height / 2 + 50);
    ctx.textAlign = 'left';
    drawStartBanner();
  }

  function draw() {
    const t = performance.now() / 1000;
    if (state.phase === 'select') {
      drawSelectScreen();
    } else if (state.phase === 'countdown') {
      drawCountdown(t);
    } else {
      withTilt(() => drawWorld(t));
      drawStartBanner();
      drawHud();
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
