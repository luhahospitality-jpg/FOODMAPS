<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>BLOCK RACERS - TV</title>
<style>
  html, body { margin:0; padding:0; background:#111; overflow:hidden; cursor:none; height:100%; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas { background:#1a1a2e; max-width:100%; max-height:100%; }
  #url { position:fixed; bottom:10px; left:10px; color:#0f0; font-family:monospace; font-size:16px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1600" height="900"></canvas>
</div>
<div id="url"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const EMOJI = { rabbit: '🐰', gorilla: '🦍', princess: '👸', ice: '🧊' };
  const NAMES = { rabbit: 'CONEJO', gorilla: 'GORILA', princess: 'PRINCESA', ice: 'HIELO' };
  const CHAR_ORDER = ['rabbit', 'gorilla', 'princess', 'ice'];
  const CROWD_COLORS = ['#ff6b6b', '#4da6ff', '#ffd24d', '#4dff88'];

  // convierte las unidades "locales" de cada figura (autos, arboles, items) a
  // unidades de mundo: la pista ahora es 10x mas grande que cuando se disenaron esas figuras
  const CLIENT_WORLD_SCALE = 10;
  const HORIZON_Y = 0; // se recalcula segun canvas.height en resize()

  document.getElementById('url').textContent =
    'Abre en tu iPhone: ' + location.origin + '/controller';

  let state = { phase: 'select', countdown: 0, track: [], trackWidth: 1700, guardrailSegments: [], players: [], boxes: [], peels: [], flowers: [], ice: { active: false } };
  socket.on('state', (s) => { state = s; });

  // ---------- camara con perspectiva (pseudo-3D, sin motor 3D real) ----------
  const camera = { x: 0, y: 0, heading: 0, height: 1200, distanceBack: 3600, focal: 1050, near: 80 };
  let cameraInit = false;
  let horizonY = 380;

  function updateCamera() {
    const active = state.players.filter(Boolean);
    if (!active.length) return;
    let sx = 0, sy = 0, hsin = 0, hcos = 0;
    active.forEach((p) => { sx += p.x; sy += p.y; hsin += Math.sin(p.angle); hcos += Math.cos(p.angle); });
    const targetX = sx / active.length, targetY = sy / active.length;
    const targetHeading = Math.atan2(hsin, hcos);

    if (!cameraInit) {
      camera.x = targetX; camera.y = targetY; camera.heading = targetHeading;
      cameraInit = true;
    } else {
      camera.x += (targetX - camera.x) * 0.08;
      camera.y += (targetY - camera.y) * 0.08;
      let dh = targetHeading - camera.heading;
      while (dh > Math.PI) dh -= Math.PI * 2;
      while (dh < -Math.PI) dh += Math.PI * 2;
      camera.heading += dh * 0.06;
    }
  }

  function worldToScreen(wx, wy) {
    const dx = wx - camera.x, dy = wy - camera.y;
    const cosA = Math.cos(camera.heading), sinA = Math.sin(camera.heading);
    const along = dx * cosA + dy * sinA;
    const across = -dx * sinA + dy * cosA;
    const depth = along + camera.distanceBack;
    if (depth < camera.near) return null;
    const scale = camera.focal / depth;
    return {
      x: canvas.width / 2 + across * scale,
      y: horizonY + camera.height * scale,
      scale,
      depth,
    };
  }

  function computeDepth(wx, wy) {
    const dx = wx - camera.x, dy = wy - camera.y;
    const along = dx * Math.cos(camera.heading) + dy * Math.sin(camera.heading);
    return along + camera.distanceBack;
  }

  // dibuja una figura definida en unidades locales (centrada en 0,0) proyectada
  // en el mundo; rotationWorld=null => siempre de pie mirando a camara (arboles, items)
  function drawProjected(wx, wy, rotationWorld, drawLocalFn) {
    const proj = worldToScreen(wx, wy);
    if (!proj) return null;
    ctx.save();
    ctx.translate(proj.x, proj.y);
    if (rotationWorld !== null) ctx.rotate(rotationWorld - camera.heading);
    const s = proj.scale * CLIENT_WORLD_SCALE;
    ctx.scale(s, s);
    drawLocalFn();
    ctx.restore();
    return proj;
  }

  // ---------- utilidades ----------
  function roundRectAt(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function radialFill(cx, cy, r, light, dark) {
    const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    g.addColorStop(0, light);
    g.addColorStop(1, dark);
    return g;
  }

  function drawTree(x, y) {
    ctx.fillStyle = '#7a4a2b';
    ctx.fillRect(x - 4, y, 8, 16);
    ctx.fillStyle = '#2e8b3d';
    ctx.beginPath(); ctx.arc(x, y - 6, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3fae52';
    ctx.beginPath(); ctx.arc(x - 5, y - 10, 9, 0, Math.PI * 2); ctx.fill();
  }

  function drawTorch(x, y, t) {
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(x - 4, y - 20, 8, 30);
    const flick = 6 + Math.sin(t * 8 + x) * 2;
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.arc(x, y - 26, flick, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(x, y - 28, flick * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawCrowd(x, y, color, t) {
    const bounce = Math.abs(Math.sin(t * 3 + x * 0.05)) * 5;
    ctx.fillStyle = color;
    ctx.fillRect(x - 6, y - 14 - bounce, 12, 16);
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath(); ctx.arc(x, y - 20 - bounce, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 10 - bounce); ctx.lineTo(x - 12, y - 20 - bounce * 1.5);
    ctx.moveTo(x + 6, y - 10 - bounce); ctx.lineTo(x + 12, y - 20 - bounce * 1.5);
    ctx.stroke();
  }

  function drawBoxLocal() {
    ctx.fillStyle = '#ffd24d';
    roundRectAt(-14, -14, 28, 28, 5);
    ctx.fill();
    ctx.fillStyle = '#a5730a';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('?', 0, 6);
    ctx.textAlign = 'left';
  }

  function drawPeelLocal() {
    ctx.fillStyle = '#e8d100';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 8, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2; ctx.stroke();
  }

  function drawFlowerLocal() {
    ctx.fillStyle = '#c04dff';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 6, Math.sin(a) * 6, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#3fae52';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- decoracion procedural a lo largo de la pista ----------
  let decorItems = [];
  let decorReady = false;

  function buildDecor(track, trackWidth) {
    const items = [];
    const half = trackWidth / 2;
    const spacing = trackWidth * 0.9;
    let carry = 0;
    let n = 0;
    for (let i = 0; i < track.length; i++) {
      const a = track[i], b = track[(i + 1) % track.length];
      const dx = b.x - a.x, dy = b.y - a.y;
      const segLen = Math.sqrt(dx * dx + dy * dy) || 1;
      const dirX = dx / segLen, dirY = dy / segLen;
      const nx = -dirY, ny = dirX;
      let d = carry;
      while (d < segLen) {
        const px = a.x + dirX * d, py = a.y + dirY * d;
        const offset = half + trackWidth * 0.3;
        const side = n % 2 === 0 ? 1 : -1;
        const kind = n % 6 === 0 ? 'torch' : n % 3 === 0 ? 'crowd' : 'tree';
        items.push({
          x: px + nx * offset * side,
          y: py + ny * offset * side,
          kind,
          color: CROWD_COLORS[n % CROWD_COLORS.length],
        });
        n++;
        d += spacing;
      }
      carry = d - segLen;
    }
    return items;
  }

  function ensureDecor() {
    if (decorReady || !state.track || !state.track.length) return;
    decorItems = buildDecor(state.track, state.trackWidth);
    decorReady = true;
  }

  // ---------- suelo y cielo ----------
  function drawGroundAndSky() {
    const sky = ctx.createLinearGradient(0, 0, 0, horizonY);
    sky.addColorStop(0, '#150c26');
    sky.addColorStop(1, '#3a2450');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, horizonY);

    const ground = ctx.createLinearGradient(0, horizonY, 0, canvas.height);
    ground.addColorStop(0, '#2f7a3d');
    ground.addColorStop(1, '#4CAF50');
    ctx.fillStyle = ground;
    ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);
  }

  // ---------- pista con perspectiva (quads proyectados) ----------
  function drawRoad() {
    const track = state.track;
    if (!track || !track.length) return;
    const half = state.trackWidth / 2;
    const guarded = state.guardrailSegments || [];

    for (let i = 0; i < track.length; i++) {
      const a = track[i], b = track[(i + 1) % track.length];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = -dy / len, ny = dx / len;

      const aL = { x: a.x + nx * half, y: a.y + ny * half };
      const aR = { x: a.x - nx * half, y: a.y - ny * half };
      const bL = { x: b.x + nx * half, y: b.y + ny * half };
      const bR = { x: b.x - nx * half, y: b.y - ny * half };

      const pAL = worldToScreen(aL.x, aL.y), pAR = worldToScreen(aR.x, aR.y);
      const pBL = worldToScreen(bL.x, bL.y), pBR = worldToScreen(bR.x, bR.y);
      if (!pAL || !pAR || !pBL || !pBR) continue;

      const avgScale = (pAL.scale + pAR.scale + pBL.scale + pBR.scale) / 4;
      // niebla de profundidad: mas cerca = mas claro, mas lejos = mas oscuro (color solido, no transparencia)
      const light = Math.max(0, Math.min(1, avgScale * 2.4));
      const asphaltC = Math.round(46 + light * 40);
      const stripeC = Math.round(150 + light * 105);

      ctx.beginPath();
      ctx.moveTo(pAL.x, pAL.y); ctx.lineTo(pBL.x, pBL.y);
      ctx.lineTo(pBR.x, pBR.y); ctx.lineTo(pAR.x, pAR.y);
      ctx.closePath();
      ctx.fillStyle = `rgb(${asphaltC},${asphaltC},${asphaltC + 6})`;
      ctx.fill();

      // franja central
      const stripeHalf = state.trackWidth * 0.025;
      const cA1 = worldToScreen(a.x + nx * stripeHalf, a.y + ny * stripeHalf);
      const cA2 = worldToScreen(a.x - nx * stripeHalf, a.y - ny * stripeHalf);
      const cB1 = worldToScreen(b.x + nx * stripeHalf, b.y + ny * stripeHalf);
      const cB2 = worldToScreen(b.x - nx * stripeHalf, b.y - ny * stripeHalf);
      if (cA1 && cA2 && cB1 && cB2) {
        ctx.beginPath();
        ctx.moveTo(cA1.x, cA1.y); ctx.lineTo(cB1.x, cB1.y);
        ctx.lineTo(cB2.x, cB2.y); ctx.lineTo(cA2.x, cA2.y);
        ctx.closePath();
        ctx.fillStyle = `rgb(${stripeC},${stripeC},${stripeC})`;
        ctx.fill();
      }

      const edgeWidth = Math.max(2, 10 * avgScale);
      const isGuarded = guarded.includes(i);
      ctx.lineWidth = edgeWidth;
      ctx.strokeStyle = isGuarded ? '#e8b800' : 'rgba(255,110,30,0.7)';
      ctx.beginPath(); ctx.moveTo(pAL.x, pAL.y); ctx.lineTo(pBL.x, pBL.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pAR.x, pAR.y); ctx.lineTo(pBR.x, pBR.y); ctx.stroke();
    }
  }

  // ---------- personajes ----------
  function drawCharacterFace(character, r) {
    if (character === 'rabbit') {
      [-1, 1].forEach((side) => {
        ctx.save();
        ctx.translate(side * r * 0.35, -r * 0.2);
        ctx.rotate(side * 0.4);
        ctx.fillStyle = radialFill(0, -r * 1.5, r * 1.1, '#ffffff', '#e3e3e3');
        ctx.beginPath(); ctx.ellipse(0, -r * 1.5, r * 0.35, r * 1.1, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb6c1';
        ctx.beginPath(); ctx.ellipse(0, -r * 1.5, r * 0.16, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
      ctx.fillStyle = radialFill(0, 0, r, '#ffffff', '#dcdcdc');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.05, r * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.32, -r * 0.05, r * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.1, r * 0.04, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.36, -r * 0.1, r * 0.04, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8fa3';
      ctx.beginPath(); ctx.arc(0, r * 0.25, r * 0.15, 0, Math.PI * 2); ctx.fill();
    } else if (character === 'gorilla') {
      ctx.fillStyle = radialFill(0, 0, r, '#8a5c3d', '#432a1a');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = radialFill(0, r * 0.3, r * 0.6, '#dab98a', '#a9825a');
      ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.6, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.05, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.05, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(-r * 0.41, -r * 0.11, r * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.29, -r * 0.11, r * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-r * 0.13, -r * 0.05); ctx.lineTo(r * 0.13, -r * 0.05); ctx.stroke();
    } else if (character === 'princess') {
      ctx.fillStyle = radialFill(0, -r * 0.1, r * 1.25, '#ffa8d6', '#e6549e');
      ctx.beginPath(); ctx.arc(0, -r * 0.1, r * 1.25, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = radialFill(0, 0, r, '#ffe6cf', '#f0be96');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 0.9); ctx.lineTo(0, -r * 1.5); ctx.lineTo(r * 0.5, -r * 0.9);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c99a1c'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#ff8fc7';
      ctx.beginPath(); ctx.arc(-r * 0.55, r * 0.15, r * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.55, r * 0.15, r * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.05, r * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.05, r * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c9c9c9';
      ctx.beginPath();
      ctx.moveTo(-r * 0.3, r * 0.35); ctx.lineTo(0, r * 1.1); ctx.lineTo(r * 0.3, r * 0.35);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#9a9a9a'; ctx.lineWidth = 1; ctx.stroke();
    } else if (character === 'ice') {
      ctx.fillStyle = radialFill(0, 0, r, '#eafcff', '#8fd6ef');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5fb8db'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#1c3d5a';
      ctx.beginPath(); ctx.ellipse(0, -r * 0.15, r * 0.85, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.25, r * 0.2, r * 0.1, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      [-1, 0, 1].forEach((k) => {
        ctx.beginPath();
        ctx.moveTo(k * r * 0.4, -r * 0.9);
        ctx.lineTo(k * r * 0.4 - r * 0.12, -r * 1.4);
        ctx.lineTo(k * r * 0.4 + r * 0.12, -r * 1.4);
        ctx.closePath(); ctx.fill();
      });
    }
  }

  function drawKartBody(character) {
    if (character === 'rabbit') {
      ctx.fillStyle = '#3fae52';
      [-1, 1].forEach((s) => {
        ctx.beginPath();
        ctx.moveTo(-18, s * 4); ctx.lineTo(-30, s * 12); ctx.lineTo(-24, s * 2);
        ctx.closePath(); ctx.fill();
      });
      ctx.beginPath();
      ctx.moveTo(26, 0); ctx.lineTo(6, -12); ctx.lineTo(-18, -10);
      ctx.lineTo(-20, 0); ctx.lineTo(-18, 10); ctx.lineTo(6, 12);
      ctx.closePath();
      ctx.fillStyle = radialFill(4, -4, 32, '#ffb066', '#e2691a');
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(-6, 9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -6); ctx.lineTo(8, 6); ctx.stroke();
    } else if (character === 'gorilla') {
      ctx.beginPath();
      ctx.moveTo(24, -2);
      ctx.quadraticCurveTo(4, -16, -22, -6);
      ctx.quadraticCurveTo(-8, -2, -8, 4);
      ctx.quadraticCurveTo(6, 10, 24, -2);
      ctx.closePath();
      ctx.fillStyle = radialFill(6, -6, 30, '#fde58a', '#d9a520');
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#7a5230';
      ctx.beginPath(); ctx.ellipse(-22, -6, 5, 4, 0.5, 0, Math.PI * 2); ctx.fill();
    } else if (character === 'princess') {
      roundRectAt(-20, -12, 40, 24, 8);
      ctx.fillStyle = radialFill(0, -4, 28, '#ff9fce', '#e63f8f');
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff0f6';
      ctx.beginPath();
      ctx.moveTo(14, -3); ctx.lineTo(19, 0); ctx.lineTo(14, 3); ctx.lineTo(10, 0);
      ctx.closePath(); ctx.fill();
    } else if (character === 'ice') {
      ctx.beginPath();
      ctx.moveTo(24, 0); ctx.lineTo(10, -13); ctx.lineTo(-20, -11);
      ctx.lineTo(-22, 0); ctx.lineTo(-20, 11); ctx.lineTo(10, 13);
      ctx.closePath();
      ctx.fillStyle = radialFill(2, -4, 30, '#e3f8ff', '#6fbedd');
      ctx.fill();
      ctx.strokeStyle = 'rgba(20,70,100,0.4)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(14, -6); ctx.lineTo(16, 0); ctx.lineTo(14, 6);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawKartLocal(p) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(2, 4, 24, 15, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-15, -16, 8, 6);
    ctx.fillRect(-15, 10, 8, 6);
    ctx.fillRect(7, -16, 8, 6);
    ctx.fillRect(7, 10, 8, 6);

    drawKartBody(p.character);
    drawCharacterFace(p.character, 9);

    if (p.boosting) {
      ctx.fillStyle = 'rgba(255,200,0,0.7)';
      ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(-40, 0); ctx.lineTo(-20, 6); ctx.closePath(); ctx.fill();
    }
    if (p.slowed) {
      ctx.strokeStyle = 'rgba(150,80,255,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
    }
    if (p.sparked) {
      ctx.strokeStyle = '#fff59d';
      ctx.lineWidth = 2;
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 16);
        ctx.lineTo(Math.cos(a) * 28, Math.sin(a) * 28);
        ctx.stroke();
      }
    }
  }

  function drawKart(p) {
    const proj = drawProjected(p.x, p.y, p.angle, () => drawKartLocal(p));
    if (!proj) return;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.id, proj.x, proj.y - 18);
    ctx.textAlign = 'left';
  }

  // ---------- escena con orden de profundidad (lejos primero) ----------
  function drawSceneObjects(t) {
    const entries = [];
    decorItems.forEach((d) => {
      entries.push({
        depth: computeDepth(d.x, d.y),
        draw: () => {
          if (d.kind === 'tree') drawProjected(d.x, d.y, null, () => drawTree(0, 0));
          else if (d.kind === 'torch') drawProjected(d.x, d.y, null, () => drawTorch(0, 0, t));
          else drawProjected(d.x, d.y, null, () => drawCrowd(0, 0, d.color, t));
        },
      });
    });
    (state.boxes || []).forEach((b) => {
      entries.push({ depth: computeDepth(b.x, b.y), draw: () => drawProjected(b.x, b.y, null, drawBoxLocal) });
    });
    (state.peels || []).forEach((pe) => {
      entries.push({ depth: computeDepth(pe.x, pe.y), draw: () => drawProjected(pe.x, pe.y, null, drawPeelLocal) });
    });
    (state.flowers || []).forEach((fl) => {
      entries.push({ depth: computeDepth(fl.x, fl.y), draw: () => drawProjected(fl.x, fl.y, null, drawFlowerLocal) });
    });
    state.players.forEach((p) => {
      if (!p) return;
      entries.push({ depth: computeDepth(p.x, p.y), draw: () => drawKart(p) });
    });

    entries.sort((a, b) => b.depth - a.depth);
    entries.forEach((e) => e.draw());
  }

  function drawStartBanner() {
    ctx.save();
    ctx.translate(canvas.width / 2, 60);
    ctx.fillStyle = '#fff';
    roundRectAt(-140, -26, 280, 52, 12);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('BLOCK RACERS', 0, 9);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function drawHud() {
    let y = 20;
    const x = canvas.width - 220;
    state.players.forEach((p) => {
      if (!p) return;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRectAt(x, y, 205, 72, 8);
      ctx.fill();
      ctx.fillStyle = p.color;
      ctx.fillRect(x, y, 8, 72);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(p.id + ' ' + (EMOJI[p.character] || ''), x + 16, y + 20);

      ctx.font = '13px sans-serif';
      ctx.fillText('VUELTA ' + p.lap, x + 16, y + 38);

      ctx.fillStyle = '#ff5f6d';
      ctx.font = '15px sans-serif';
      ctx.fillText('❤'.repeat(p.lives) + '♡'.repeat(Math.max(0, 3 - p.lives)), x + 16, y + 58);

      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = p.hasBoost ? '#ffd24d' : '#555';
      ctx.fillText('BOOST', x + 120, y + 38);
      ctx.fillStyle = p.powerReady ? '#8effa0' : '#555';
      ctx.fillText('PODER', x + 120, y + 58);

      y += 82;
    });
  }

  // ---------- pantalla de seleccion (sin camara, plana) ----------
  function drawSelectScreen() {
    ctx.fillStyle = '#141426';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px Arial';
    ctx.fillText('BLOCK RACERS', canvas.width / 2, 110);
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#ffd24d';
    ctx.fillText('ELIGE TU CORREDOR', canvas.width / 2, 150);

    const cardW = 260, cardH = 300, gap = 30;
    const totalW = cardW * 4 + gap * 3;
    const startX = (canvas.width - totalW) / 2;
    const cardY = 220;

    CHAR_ORDER.forEach((char, i) => {
      const cx = startX + i * (cardW + gap);
      ctx.fillStyle = '#1f1f38';
      roundRectAt(cx, cardY, cardW, cardH, 16);
      ctx.fill();

      ctx.save();
      ctx.translate(cx + cardW / 2, cardY + 110);
      ctx.scale(3.2, 3.2);
      drawCharacterFace(char, 9);
      ctx.restore();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px Arial';
      ctx.fillText(NAMES[char], cx + cardW / 2, cardY + 210);

      const holders = state.players.filter((p) => p && p.character === char);
      holders.forEach((p, hi) => {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 5;
        roundRectAt(cx + 4, cardY + 4, cardW - 8, cardH - 8, 14);
        ctx.stroke();
        ctx.fillStyle = p.color;
        ctx.font = 'bold 16px Arial';
        ctx.fillText((p.confirmed ? '✔ ' : '') + p.id, cx + cardW / 2, cardY + cardH - 20 - hi * 20);
      });
    });

    ctx.font = '16px Arial';
    ctx.fillStyle = '#ccc';
    ctx.fillText('Movan el joystick para elegir y toquen ELEGIR para confirmar', canvas.width / 2, cardY + cardH + 50);
    ctx.textAlign = 'left';
  }

  function drawWorld(t) {
    updateCamera();
    ensureDecor();
    drawGroundAndSky();
    drawRoad();
    drawSceneObjects(t);
  }

  function drawCountdown(t) {
    drawWorld(t);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 160px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(state.countdown > 0 ? String(state.countdown) : 'GO!', canvas.width / 2, canvas.height / 2 + 50);
    ctx.textAlign = 'left';
    drawStartBanner();
  }

  function draw() {
    const t = performance.now() / 1000;
    if (state.phase === 'select') {
      drawSelectScreen();
    } else if (state.phase === 'countdown') {
      drawCountdown(t);
    } else {
      drawWorld(t);
      drawStartBanner();
      drawHud();
    }
    requestAnimationFrame(draw);
  }

  horizonY = canvas.height * 0.42;
  draw();
</script>
</body>
</html>
