<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BLOCK RACERS - TV</title>
<link rel="preload" href="/assets/fonts/LilitaOne.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family: 'Lilita One'; src: url('/assets/fonts/LilitaOne.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Fredoka'; src: url('/assets/fonts/Fredoka-600.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
  :root {
    --red:#FF4B5C; --orange:#FF9F1C; --yellow:#FFD93D; --green:#55D66A; --turq:#3BD9D0;
    --blue:#4D7CFE; --violet:#9B5DE5; --pink:#FF6FB5; --white:#FFF8E7; --black:#202030; --ice:#A9F3FF;
    --navy:#141a45; --navy2:#1d2766;
  }
  html, body { margin:0; padding:0; background:#05050c; overflow:hidden; cursor:none; height:100%; }
  #gl { position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:100%; display:block; }
  #ui { position:fixed; top:0; right:0; bottom:0; left:0; pointer-events:none; font-family:'Lilita One', 'Fredoka', Impact, sans-serif; color:var(--white); }
  .outline { -webkit-text-stroke: 0.09em var(--black); paint-order: stroke fill; text-shadow: 0 0.08em 0 var(--black); }

  /* ---------- carga ---------- */
  #loading { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #3b2a8a, #120a2e 70%); z-index:50; transition:opacity .5s; }
  #loading img { width:min(46vw, 620px); filter:drop-shadow(0 12px 30px rgba(0,0,0,.5)); animation:bob 1.6s ease-in-out infinite; }
  #loading .bar { margin-top:3vh; width:30vw; height:1.6vh; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; border:3px solid var(--black); }
  #loading .fill { height:100%; width:0%; background:linear-gradient(90deg, var(--red), var(--orange), var(--yellow), var(--green), var(--blue), var(--violet)); transition:width .3s; }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-1deg); } 50% { transform:translateY(-10px) rotate(1deg); } }

  /* ---------- seleccion ---------- */
  #select { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    background:linear-gradient(180deg, rgba(18,10,46,.55) 0%, rgba(18,10,46,.25) 30%, rgba(10,8,30,.75) 100%); padding-top:1.5vh; }
  #logo { height:21vh; filter:drop-shadow(0 1vh 2.2vh rgba(0,0,0,.55)); animation:bob 2.4s ease-in-out infinite; }
  .stitle { font-size:2.5vh; letter-spacing:.12em; margin:1.2vh 0 1vh; padding:.35vh 2.2vh; border-radius:99px;
    background:rgba(20,26,69,.85); border:.35vh solid rgba(77,124,254,.8); box-shadow:0 0 2vh rgba(77,124,254,.5); }
  #charCards { display:flex; gap:1.8vw; }
  .ccard { position:relative; width:14.5vw; height:36vh; border-radius:2.4vh; overflow:hidden; border:.55vh solid var(--black);
    box-shadow:0 1.2vh 0 rgba(0,0,0,.35), inset 0 .6vh 0 rgba(255,255,255,.35); transition:transform .18s, box-shadow .18s;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .ccard::before { content:''; position:absolute; top:0; right:0; bottom:0; left:0; background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.45), rgba(255,255,255,0) 60%); }
  .ccard img { position:absolute; bottom:9.3vh; left:50%; transform:translateX(-50%); height:23vh; filter:drop-shadow(0 .8vh .6vh rgba(0,0,0,.35)); }
  .ccard .cname { position:relative; font-size:3.1vh; line-height:1; margin-bottom:.4vh; }
  .ccard .cpower { position:relative; width:100%; text-align:center; font-size:1.7vh; padding:.7vh 0 .9vh; background:rgba(32,32,48,.55); letter-spacing:.05em; }
  .ccard .holders { position:absolute; top:1vh; left:0; right:0; display:flex; justify-content:center; gap:.5vw; }
  .chip { font-size:2vh; padding:.25vh 1vh; border-radius:99px; border:.35vh solid var(--black); color:var(--white); }
  .chip.ok::before { content:'✔ '; }
  .ccard.picked { transform:translateY(-1.6vh) scale(1.04); }
  .ccard.confirmed { box-shadow:0 0 0 .6vh var(--white), 0 0 4vh 1vh rgba(255,217,61,.8); }
  #trackRow { display:flex; align-items:center; gap:1.4vw; }
  #trackRow .arrow { font-size:4vh; color:var(--yellow); }
  #trackCards { display:flex; gap:1.4vw; }
  .tcard { width:15vw; border-radius:2vh; overflow:hidden; border:.5vh solid var(--black); background:#1a1f4a; opacity:.55; transform:scale(.9); transition:all .2s;
    box-shadow:0 1vh 0 rgba(0,0,0,.35); }
  .tcard.active { opacity:1; transform:scale(1.06); box-shadow:0 0 0 .5vh var(--yellow), 0 0 3.5vh 1vh rgba(255,217,61,.6); }
  .tcard .thumb { height:11vh; background-size:cover; background-position:center; }
  .tcard .tname { text-align:center; font-size:2vh; padding:.7vh 0; }
  #selHint { margin-top:1.6vh; font-family:'Fredoka', sans-serif; font-weight:600; font-size:2vh; color:#e8e3ff; text-shadow:0 2px 0 #000; }
  #selHint b { color:var(--yellow); }

  /* ---------- HUD por jugador ---------- */
  #views { position:absolute; top:0; right:0; bottom:0; left:0; }
  .vhud { position:absolute; overflow:hidden; font-size:calc(16px * var(--s, 1)); }
  .vhud .frame { position:absolute; top:0; right:0; bottom:0; left:0; border:.18em solid rgba(32,32,48,.9); pointer-events:none; }
  .panel { position:absolute; border-radius:1em; border:.22em solid var(--black); background:linear-gradient(180deg, #2b3aa0, #172067);
    box-shadow:0 .3em 0 rgba(0,0,0,.35), inset 0 .25em 0 rgba(255,255,255,.2); }
  .p-pos { top:.9em; left:.9em; padding:.35em 1em .5em; border-color:var(--black); box-shadow:0 0 0 .2em rgba(77,124,254,.9), 0 0 1.4em rgba(77,124,254,.7), 0 .3em 0 rgba(0,0,0,.35); }
  .p-pos .lbl { font-size:1em; letter-spacing:.08em; text-align:center; }
  .p-pos .big { font-size:4.4em; line-height:.9; background:linear-gradient(180deg, #fff6b0, #FFD93D 45%, #FF9F1C); -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:.05em var(--black); filter:drop-shadow(0 .06em 0 var(--black)); }
  .p-pos .of { font-size:2em; color:var(--white); }
  .p-lap { top:.9em; left:9.4em; padding:.25em 1em .35em; text-align:center; }
  .p-lap .lbl { font-size:.95em; letter-spacing:.08em; color:#bfe0ff; }
  .p-lap .val { font-size:2.4em; line-height:1; }
  .p-item { top:.9em; right:.9em; width:5.4em; height:5.4em; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#3a2a7a,#1c1450); }
  .p-item img, .p-item svg { width:78%; height:78%; object-fit:contain; filter:drop-shadow(0 .15em 0 rgba(0,0,0,.4)); }
  .p-item.rolling img, .p-item.rolling svg { animation:roll .12s linear infinite; }
  .p-item.has { box-shadow:0 0 0 .2em var(--yellow), 0 0 1.4em rgba(255,217,61,.8), 0 .3em 0 rgba(0,0,0,.35); }
  @keyframes roll { 0% { transform:translateY(-8%) scale(.9); } 50% { transform:translateY(8%) scale(1.05); } 100% { transform:translateY(-8%) scale(.9); } }
  .p-power { bottom:.9em; left:.9em; padding:.3em .9em .3em .4em; display:flex; align-items:center; gap:.4em; }
  .p-power img { width:2.8em; height:2.8em; object-fit:contain; }
  .p-power .t { font-size:1.35em; line-height:1; }
  .p-power.ready { background:linear-gradient(180deg,#6fe882,#2fae4a); box-shadow:0 0 0 .2em rgba(85,214,106,.9), 0 0 1.2em rgba(85,214,106,.7), 0 .3em 0 rgba(0,0,0,.35); }
  .p-power.cool { filter:saturate(.4) brightness(.8); }
  .p-coins { bottom:.9em; right:.9em; padding:.25em .8em; display:flex; align-items:center; gap:.35em; }
  .p-coins img { width:1.9em; }
  .p-coins .n { font-size:1.8em; }
  .p-coins .hearts { font-size:1.2em; margin-left:.4em; color:var(--red); letter-spacing:.05em; }
  .p-coins .hearts .off { color:#4a4a66; }
  .p-boost { bottom:.9em; left:50%; transform:translateX(-50%); padding:.3em 1.2em; font-size:1.3em; display:none; align-items:center; gap:.5em;
    background:linear-gradient(180deg,#1e2a70,#0f1540); box-shadow:0 0 0 .15em rgba(59,217,208,.9), 0 0 1.2em rgba(59,217,208,.7); }
  .p-boost .chev { color:var(--turq); letter-spacing:-.1em; animation:chev .5s linear infinite; }
  .p-boost.active { background:linear-gradient(90deg,#ff4b5c,#ff9f1c,#ffd93d,#55d66a,#4d7cfe,#9b5de5); background-size:300% 100%; animation:rb 1s linear infinite; }
  @keyframes chev { 0% { opacity:.4; } 50% { opacity:1; } 100% { opacity:.4; } }
  @keyframes rb { 0% { background-position:0 0; } 100% { background-position:300% 0; } }
  .v-banner { position:absolute; left:0; right:0; top:32%; text-align:center; font-size:4.2em; opacity:0; transform:scale(.6); transition:all .25s; }
  .v-banner.show { opacity:1; transform:scale(1); }
  /* modo TV: sin sombras difusas, filtros ni animaciones CSS sobre el juego (el navegador de la
     TV los recompone en cada cuadro y le roba tiempo al 3D) */
  body[data-quality="tv"] .vhud *, body[data-quality="tv"] #countdown *, body[data-quality="tv"] #finishFlash * {
    box-shadow:none !important; filter:none !important; animation:none !important; transition:none !important; text-shadow:none !important; }
  body[data-quality="tv"] .p-boost.active { background:#ff9f1c; }
  .v-done { position:absolute; left:0; right:0; top:12%; text-align:center; display:none; color:var(--yellow); }
  .v-done.on { display:block; }
  .v-done .tt { font-size:3.2em; line-height:1; }
  .v-done .pl { font-size:6em; line-height:1; }
  .v-done .sub { font-size:1.8em; color:var(--white); margin-top:.2em; }
  .frost { position:absolute; top:0; right:0; bottom:0; left:0; opacity:0; transition:opacity .4s; background:radial-gradient(ellipse at center, rgba(169,243,255,0) 62%, rgba(169,243,255,.38) 100%);
    box-shadow:inset 0 0 3em rgba(255,255,255,.35); }
  .frost.on { opacity:1; }
  .hitflash { position:absolute; top:0; right:0; bottom:0; left:0; background:rgba(255,75,92,.35); opacity:0; transition:opacity .35s; }
  .hitflash.on { opacity:1; transition:none; }

  /* ---------- cuenta regresiva ---------- */
  #countdown { position:absolute; top:0; right:0; bottom:0; left:0; display:none; align-items:center; justify-content:center; }
  #countdown span { font-size:32vh; line-height:1; background:linear-gradient(180deg,#fff6b0,#FFD93D 45%,#FF9F1C); -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.6vh var(--black); paint-order:stroke fill; filter:drop-shadow(0 1.4vh 0 var(--black)) drop-shadow(0 0 4vh rgba(255,217,61,.6)); }
  #countdown span.go { background:linear-gradient(180deg,#e9ffb0,#55D66A 50%,#2aa84a); -webkit-background-clip:text; background-clip:text; }
  #countdown span.pop { animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform:scale(2.2); opacity:0; } 100% { transform:scale(1); opacity:1; } }

  /* ---------- FINISH / podio ---------- */
  #finishFlash { position:absolute; top:0; right:0; bottom:0; left:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(10,8,30,.25); }
  #finishFlash img { height:20vh; animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
  #finishFlash .t { font-size:16vh; animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
  #podiumUI { position:absolute; top:0; right:0; bottom:0; left:0; display:none; flex-direction:column; align-items:center; justify-content:space-between; padding:1.5vh 0 1.2vh; }
  #podiumUI .top { display:flex; flex-direction:column; align-items:center; }
  #podiumUI .crown { height:8vh; filter:drop-shadow(0 0 3vh rgba(255,217,61,.9)); animation:bob 1.4s ease-in-out infinite; }
  #podiumUI .winner { font-size:10vh; line-height:.95; background:linear-gradient(180deg,#fff6b0,#FFD93D 45%,#FF9F1C); -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1vh var(--black); paint-order:stroke fill; filter:drop-shadow(0 1vh 0 var(--black)); }
  #podiumUI .who { font-size:3.6vh; margin-top:.4vh; }
  #podiumUI .again { font-size:3.8vh; padding:1vh 5vh; border-radius:99px; color:var(--black); background:linear-gradient(180deg,#fff08a,#FFD93D 50%,#f5b400);
    border:.6vh solid var(--black); box-shadow:0 .9vh 0 rgba(0,0,0,.4), inset 0 .6vh 0 rgba(255,255,255,.5); animation:bob 1.2s ease-in-out infinite; }
  #podiumUI .sub { font-family:'Fredoka', sans-serif; font-weight:600; font-size:2vh; margin-top:1.2vh; color:#e8e3ff; }

  #url { position:absolute; bottom:1vh; left:1.2vh; color:var(--green); font-family:'Fredoka', monospace; font-weight:600; font-size:1.9vh; text-shadow:0 2px 0 #000; }
  #bootErr { display:none; margin-top:3vh; max-width:80vw; font-family:'Fredoka', sans-serif; font-size:2.2vh; color:#ffd0d6; background:rgba(0,0,0,.45); padding:1vh 2vh; border-radius:1vh; text-align:center; }
  #ver { position:absolute; top:.6vh; right:1vh; font-family:'Fredoka', sans-serif; font-size:1.4vh; color:rgba(255,255,255,.4); z-index:60; }
  #qbadge { position:absolute; bottom:1vh; right:1.2vh; font-family:'Fredoka', sans-serif; font-size:1.3vh; color:rgba(255,255,255,.35); }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <div id="views"></div>
  <div id="countdown"><span id="countdownNum">3</span></div>
  <div id="finishFlash"><img src="/assets/ui/fx_finish.png" alt="" /><div class="t outline">FINISH!</div></div>
  <div id="podiumUI">
    <div class="top">
      <img class="crown" src="/assets/ui/fx_crown.png" alt="" />
      <div class="winner">WINNER!</div>
      <div class="who outline" id="podiumWho">P1</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="again">PLAY AGAIN</div>
      <div class="sub" id="podiumSub">Toca START en tu celular</div>
    </div>
  </div>
  <div id="select">
    <img id="logo" src="/assets/ui/logo.png" alt="BLOCK RACERS" />
    <div class="stitle outline">SELECCIÓN DE PERSONAJES</div>
    <div id="charCards"></div>
    <div class="stitle outline">SELECCIÓN DE PISTAS</div>
    <div id="trackRow"><span class="arrow outline">◀</span><div id="trackCards"></div><span class="arrow outline">▶</span></div>
    <div id="selHint">Mové el joystick para elegir · <b>ELEGIR</b> para confirmar · <b>PISTA</b> cambia de pista</div>
  </div>
  <div id="url"></div>
  <div id="qbadge"></div>
  <div id="loading"><img src="/assets/ui/logo.png" alt="" /><div class="bar"><div class="fill" id="loadFill"></div></div><div id="bootErr"></div></div>
  <div id="ver">v4</div>
</div>

<script>
  // si algo falla en la TV, que se vea en pantalla (para poder contarlo) en vez de quedar trabado
  window.__showBootError = function (e) {
    var l = document.getElementById('loading');
    if (!l) return;
    l.style.display = 'flex'; l.style.opacity = '1';
    var d = document.getElementById('bootErr');
    d.style.display = 'block';
    d.textContent = 'Error: ' + (e && (e.message || e)) + '  |  ' + navigator.userAgent;
  };
  window.addEventListener('error', function (ev) { window.__showBootError(ev.error || ev.message); });
  window.addEventListener('unhandledrejection', function (ev) { window.__showBootError(ev.reason); });
  setTimeout(function () {
    var l = document.getElementById('loading');
    if (l && l.style.display !== 'none') window.__showBootError('la carga no termino en 40s');
  }, 40000);
</script>
<script nomodule>document.getElementById('bootErr').style.display='block';document.getElementById('bootErr').textContent='Este navegador es demasiado viejo para el juego: ' + navigator.userAgent;</script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/tv/js/main.js"></script>
</body>
</html>
